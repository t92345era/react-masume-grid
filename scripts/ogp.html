<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* 1280×640（2:1）。X / Slack では横 400〜500px まで縮むので、
         この縮尺で読めるかどうかだけを基準に文字サイズを決めている */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1280px;
        height: 640px;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 64px;
        background: #f7f9fc;
        font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif;
        color: #10151d;
        overflow: hidden;
      }

      .left { width: 560px; flex: none; }

      .name {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .name span { color: #1d70d6; }

      .tagline {
        margin-top: 26px;
        font-size: 35px;
        font-weight: 700;
        line-height: 1.45;
      }

      .sub {
        margin-top: 14px;
        font-size: 21px;
        font-weight: 500;
        color: #5b6675;
      }

      .chips { margin-top: 34px; display: flex; gap: 10px; }

      .chip {
        padding: 9px 18px;
        border: 2px solid #d3dce6;
        border-radius: 999px;
        background: #fff;
        font-size: 20px;
        font-weight: 700;
        color: #41506180;
        color: #415061;
      }

      /* ── グリッドのモック ───────────────────── */
      .grid {
        flex: 1;
        border: 2px solid #cdd5df;
        background: #fff;
        /* IME の候補ウィンドウがセルの外へ出るので clip しない */
        overflow: visible;
        box-shadow: 0 18px 44px rgba(20, 40, 70, 0.14);
        font-size: 23px;
      }

      .row { display: flex; border-bottom: 2px solid #e6eaf0; }
      .row:last-child { border-bottom: 0; }

      .head { background: #f2f4f7; color: #55606e; font-weight: 700; }

      .cell {
        padding: 17px 16px;
        border-right: 2px solid #e6eaf0;
        white-space: nowrap;
        overflow: hidden;
      }

      .cell:last-child { border-right: 0; }
      .c-no { width: 66px; text-align: center; color: #97a0ad; }
      .c-name { width: 250px; }
      .c-price { width: 150px; text-align: right; }

      /* 編集中のセル: 選択枠 + キャレット + IME の変換中下線 */
      .editing {
        position: relative;
        /* .cell の overflow: hidden を打ち消す。候補ウィンドウはセルの外に出る */
        overflow: visible;
        z-index: 3;
        outline: 4px solid #1d70d6;
        outline-offset: -4px;
        background: #fff;
      }

      .composing {
        border-bottom: 3px solid #1d70d6;
        padding-bottom: 2px;
      }

      .caret {
        display: inline-block;
        width: 3px;
        height: 26px;
        margin-left: 3px;
        background: #10151d;
        vertical-align: -5px;
      }

      /* IME の候補ウィンドウ */
      .ime {
        position: absolute;
        top: 58px;
        left: -4px;
        width: 208px;
        border: 2px solid #cdd5df;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(20, 40, 70, 0.2);
        font-size: 21px;
        overflow: hidden;
        z-index: 2;
      }

      .ime div { padding: 9px 14px; }
      .ime .on { background: #1d70d6; color: #fff; }

      .keycap {
        display: inline-block;
        min-width: 42px;
        margin-right: 10px;
        padding: 5px 10px;
        border: 2px solid #cdd5df;
        border-bottom-width: 4px;
        border-radius: 7px;
        background: #fff;
        font-size: 20px;
        font-weight: 700;
        text-align: center;
      }

      .keyline {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #415061;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="name">Masume<span>Grid</span></div>
      <div class="tagline">日本語IMEで、そのまま<br />入力できるグリッド</div>
      <div class="sub">A React spreadsheet grid with real IME support</div>
      <div class="chips">
        <span class="chip">React only</span>
        <span class="chip">12.5KB gzip</span>
        <span class="chip">MIT</span>
      </div>
      <div class="keyline">
        <span><span class="keycap">A</span>を押すと</span>
        <span>→</span>
        <span>セルが編集状態になり「あ」が入る</span>
      </div>
    </div>

    <div class="grid">
      <div class="row head">
        <div class="cell c-no"></div>
        <div class="cell c-name">商品名</div>
        <div class="cell c-price">単価</div>
      </div>
      <div class="row">
        <div class="cell c-no">1</div>
        <div class="cell c-name">りんご</div>
        <div class="cell c-price">100</div>
      </div>
      <div class="row">
        <div class="cell c-no">2</div>
        <div class="cell c-name editing">
          <span class="composing">あ</span><span class="caret"></span>
          <div class="ime">
            <div class="on">あ</div>
            <div>亜</div>
            <div>阿</div>
          </div>
        </div>
        <div class="cell c-price">80</div>
      </div>
      <div class="row">
        <div class="cell c-no">3</div>
        <div class="cell c-name">ぶどう</div>
        <div class="cell c-price">400</div>
      </div>
    </div>
  </body>
</html>
